name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Очищаємо попередній деплой
      - name: Clean previous deployment
        run: |
          rm -rf ./deploy_temp
          mkdir -p deploy_temp
          cp -r js/lab8/task1/* deploy_temp/
          cp deploy_temp/* ./ -f
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'js/lab8/task1'  # Залишаємо вашу теку
          name: 'github-pages'
          retention-days: 3 # Додаємо короткий термін зберігання
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: 'github-pages'
